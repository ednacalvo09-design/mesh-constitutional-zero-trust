name: MESH Audit
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install tsx
        run: npm install -g tsx
      - name: Test with glm-5
        run: |
          echo "=== MESH Constitutional Zero-Trust ==="
          echo "Tester: glm-5 - 25 agents"
          tsx src/5-referencia-qualidade-memoria/glm-5/runner.ts
          ls -R src
