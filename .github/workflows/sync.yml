name: Sync to Google Drive

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload to Google Drive
        uses: Jumbo810/Upload_Github_Artifacts_TO_GDrive@v2.3.5
        with:
          args: |
            parent_folder_id: ${{ secrets.GDRIVE_FOLDER_ID }}
            client_email: ${{ fromJson(secrets.GDRIVE_SERVICE_ACCOUNT_KEY).client_email }}
            private_key: ${{ fromJson(secrets.GDRIVE_SERVICE_ACCOUNT_KEY).private_key }}
            target_folder: .
            override: true
