name: Mesh Constitutional - CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pylint
      - name: Test with pytest
        env:
          PYTHONPATH: .
        run: |
          export PYTHONPATH=$PYTHONPATH:./src/runtime/3-execucao-area-operacional:./src/runtime/4-governanca-aut
          python -m pytest src/runtime/5-referencia-qualidade-memoria/tests/test_exemplo.py -v
