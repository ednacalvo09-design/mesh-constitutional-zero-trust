name: Mesh Constitutional - CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: Install deps
      run: |
        python -m pip install --upgrade pip
        pip install pytest pylint
    
    - name: Check - arquivos com espaco
      run: |
        echo "Verificando..."
        if find src -name "* *" -type f | grep .; then
          echo "ERRO: arquivo com espaco!"
          exit 1
        fi
        echo "OK - sem espacos"
    
    - name: Lint - Pylint
      run: |
        pylint src/ --errors-only || true
    
    - name: Test - Quality Memory
      run: |
        pytest src/runtime/5-referencia-qualidade-memoria/tests/ -v || true
